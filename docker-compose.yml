services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: batwara
      POSTGRES_PASSWORD: batwara
      POSTGRES_DB: batwara
    volumes:
      - batwara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batwara"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://batwara:batwara@db:5432/batwara
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  batwara_pgdata:
